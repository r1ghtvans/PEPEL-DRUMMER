name: Build PEPEL DRUMMER (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PEPEL-DRUMMER-VST3
          path: build/PepelDrummer_artefacts/Release/VST3
